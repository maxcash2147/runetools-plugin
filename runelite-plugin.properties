displayName=RuneTools
author=RuneTools
# The Plugin Hub packager treats a missing "build" as fatal on any fork PR (where the upload config
# is incomplete), so the submission fails CI before a reviewer sees it. "standard" is correct here:
# build.gradle adds nothing beyond the template.
build=standard
version=1.0.0
# What the Hub listing shows before anyone installs, so it names everything the plugin syncs, not
# just the trades it started as.
description=Sync your Grand Exchange trades, account, collection log, combat achievements, gear setups and bank to RuneTools (runetools.com) for profit tracking, best-in-slot gear and bankroll-aware flip suggestions.
tags=grand exchange,ge,flip,flipping,merch,money,profit,prices,gp,runetools,osrs,pnl,collection log,combat achievements,bank,gear,setups,dps
plugins=com.runetools.RuneToolsPlugin
